name: Engine tests and certificates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    # The engine that ran the campaign: 101 tests, including the calendar (28 pulses, T = 230)
    # and the regression test of the lemma-E outward rounding.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Install the pinned dependencies
        run: python -m pip install -r engine/requirements.txt
      - name: Build the native extensions
        working-directory: engine
        run: python build_all_native.py
      - name: Unit tests
        working-directory: engine
        run: python -B -m unittest discover -s tests
      - name: Learning comparison checks
        run: python -B -m unittest discover -s experiments/tests

  certificates:
    # Recomputes the initial section, the future certificate, the independent check and Q28
    # from the committed terminal records and compares them (tools/verify.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and compare
        run: python -I tools/verify.py
      - name: Verification tool regressions
        run: python -B -m unittest discover -s tools/tests
